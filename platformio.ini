[env:Dell]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps = 
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	makuna/RTC@^2.5.0
	adafruit/RTClib@^2.1.4
	locple/LiquidCrystal_I2C_UTF8@^1.2.2
	arduino-libraries/LiquidCrystal@^1.0.7
